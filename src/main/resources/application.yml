spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/runmateai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RunmateHikariPool
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:3000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_THRESHOLD:60000}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 ddl-auto: update로 스키마가 만들어져 있는 운영 DB를 위한 설정.
    # 스키마 이력 테이블(flyway_schema_history)이 없는 "비어있지 않은" DB에 처음 붙으면,
    # V1(baseline-version)까지는 이미 적용된 것으로 간주하고 건너뛴 뒤 V2부터 실제로 실행한다.
    # 반대로 완전히 빈 로컬/신규 DB에서는 이 옵션이 트리거되지 않고, V1부터 정상적으로 전부 실행된다.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway 도입 이후: Hibernate가 스키마를 직접 바꾸지 않고, 엔티티와 실제 DB 스키마가
      # 일치하는지 "검증"만 한다. 불일치 시 애플리케이션 시작 자체를 막아, 마이그레이션
      # 파일 추가를 깜빡한 배포를 실행 전에 잡아낸다.
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

logging:
  level:
    com.runmateai: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:WARN}

claude:
  api:
    key: ${CLAUDE_API_KEY}
    url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-6

cors:
  # 배포 시 AWS CloudFront URL 또는 커스텀 도메인을 쉼표로 추가
  # 예: http://localhost:5173,http://localhost:5174,https://xxxx.cloudfront.net
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs