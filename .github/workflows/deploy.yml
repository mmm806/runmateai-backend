name: Backend CI/CD
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3
      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: 테스트 실행
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
        env:
          # 테스트 전용 더미 값. 실제 시크릿이 아니며, JWT는 서명/검증 로직만 확인하고
          # Claude API는 모든 테스트에서 목(mock)으로 대체되어 있어 실제로 호출되지 않는다.
          JWT_SECRET: ci-test-only-dummy-secret-key-not-used-in-production-1234567890
          CLAUDE_API_KEY: ci-test-only-dummy-key-not-called
      - name: 테스트 결과 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 7

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3
      - name: GitHub Container Registry 로그인
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Docker 이미지 빌드 및 GHCR에 Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runmateai-backend:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2 SSH 접속 후 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GHCR_USERNAME,GHCR_TOKEN,REPO_OWNER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull ghcr.io/$REPO_OWNER/runmateai-backend:latest
            cd ~/runmateai-backend
            git pull origin main
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            echo "헬스체크 대기 중..."
            for i in $(seq 1 15); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' runmateai-app 2>/dev/null || echo "not-found")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ 배포 성공, app healthy"
                docker image prune -f
                exit 0
              fi
              echo "  ($i/15) 상태: $STATUS"
              sleep 5
            done

            echo "❌ 헬스체크 실패 - app이 healthy 상태가 되지 않음"
            docker logs runmateai-app --tail 50
            exit 1
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}